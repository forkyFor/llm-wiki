<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Wiki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>📚 LLM Wiki</h1>
  <div class="status-dot" id="ollama-dot"></div>
  <span class="status-label" id="ollama-label">Connessione…</span>
</header>

<main>
  <!-- LEFT: File panel -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2>File RAW</h2>
      <div class="sidebar-head-actions">
        <button class="new-folder-btn" id="new-root-folder-btn" title="Nuova cartella radice">+ Cartella</button>
        <span id="file-count" style="font-size:12px;color:var(--text-dim)">0 file</span>
      </div>
    </div>

    <div class="file-list" id="file-list">
      <div class="empty-state" id="file-empty" style="padding:40px 20px;font-size:13px;">
        Nessun file.<br>Carica un documento sotto.
      </div>
    </div>

    <div class="upload-area">
      <div class="upload-target" id="upload-target">
        <span>📂</span>
        <span class="target-path" id="upload-target-path"></span>
        <span class="target-clear" id="upload-target-clear" title="Carica nella radice">✕</span>
      </div>
      <div class="drop-zone" id="drop-zone">
        <div class="upload-icon">⬆️</div>
        <div>Trascina o <strong>clicca</strong> per caricare</div>
        <div style="margin-top:4px;font-size:11px;">PDF, PNG, JPG, TXT e altri</div>
        <input type="file" id="file-input" multiple />
      </div>
    </div>
  </aside>

  <!-- RIGHT: Chat panel -->
  <section class="chat-panel">
    <div class="messages" id="messages">
      <div class="empty-state" id="chat-empty">
        <div class="icon">💬</div>
        <div>Fai una domanda sulla tua wiki</div>
        <div style="font-size:12px;margin-top:4px;">Le risposte citeranno i file sorgente</div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea id="chat-input" rows="1" placeholder="Domanda sulla wiki… (Invio per inviare, Shift+Invio per a capo)"></textarea>
      <button class="send-btn" id="send-btn">Invia</button>
    </div>
  </section>
</main>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Elimina</h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modal-cancel">Annulla</button>
      <button class="btn btn-danger" id="modal-confirm">Elimina</button>
    </div>
  </div>
</div>

<!-- Log panel -->
<div id="log-panel" class="log-panel collapsed">
  <div class="log-header" id="log-toggle">
    <span class="log-title">Log</span>
    <span class="log-badge" id="log-badge"></span>
    <span class="log-chevron" id="log-chevron">&#x25B2;</span>
  </div>
  <div class="log-body">
    <div class="log-lines" id="log-lines"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
