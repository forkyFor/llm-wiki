<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Wiki</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>📚 LLM Wiki</h1>
  <div class="status-dot" id="ollama-dot"></div>
  <span class="status-label" id="ollama-label">Connecting…</span>
  <span id="auth-user" style="margin-left:auto;font-size:13px;color:var(--text-dim)"></span>
  <a href="/admin.html" id="admin-link" style="display:none;font-size:13px;margin-left:12px">Users</a>
  <button id="logout-btn" style="display:none;margin-left:10px;background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">Logout</button>
</header>

<main>
  <!-- LEFT: File panel -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2>Raw Files</h2>
      <div class="sidebar-head-actions">
        <button class="new-folder-btn" id="new-root-folder-btn" title="New root folder">+ Folder</button>
        <span id="file-count" style="font-size:12px;color:var(--text-dim)">0 file</span>
      </div>
    </div>

    <div class="file-list" id="file-list">
      <div class="empty-state" id="file-empty" style="padding:40px 20px;font-size:13px;">
        No files.<br>Upload a document below.
      </div>
    </div>

    <div class="upload-area">
      <div class="upload-target" id="upload-target">
        <span>📂</span>
        <span class="target-path" id="upload-target-path"></span>
        <span class="target-clear" id="upload-target-clear" title="Upload to root">✕</span>
      </div>
      <div class="drop-zone" id="drop-zone">
        <div class="upload-icon">⬆️</div>
        <div>Drag or <strong>click</strong> to upload</div>
        <div style="margin-top:4px;font-size:11px;">PDF, PNG, JPG, TXT and more</div>
        <input type="file" id="file-input" multiple />
      </div>
    </div>
  </aside>

  <!-- RIGHT: Chat panel -->
  <section class="chat-panel">
    <div class="messages" id="messages">
      <div class="empty-state" id="chat-empty">
        <div class="icon">💬</div>
        <div>Ask a question about your wiki</div>
        <div style="font-size:12px;margin-top:4px;">Answers will cite source files</div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea id="chat-input" rows="1" placeholder="Ask the wiki… (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </section>
</main>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Delete</h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- Log panel -->
<div id="log-panel" class="log-panel collapsed">
  <div class="log-header" id="log-toggle">
    <span class="log-title">Log</span>
    <span class="log-badge" id="log-badge"></span>
    <span class="log-chevron" id="log-chevron">&#x25B2;</span>
  </div>
  <div class="log-body">
    <div class="log-lines" id="log-lines"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
